<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Операционная система</title>
<style>
:root{--c1:#4f8cff;--c2:#8b5cf6;--c3:#22d3ee;--tx:#eaf0ff;--mut:#9fb0d8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#03050f;overflow:hidden;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:radial-gradient(circle at 20% 10%,#14204f,#070b1f 55%,#03050f)}
.bg{position:absolute;inset:0;background-image:linear-gradient(rgba(120,150,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,255,.07) 1px,transparent 1px);background-size:80px 80px;animation:grid 12s linear infinite}
@keyframes grid{to{background-position:80px 80px}}
.orb{position:absolute;border-radius:50%;filter:blur(110px);opacity:.45;animation:fl 14s ease-in-out infinite alternate}
.o1{width:700px;height:700px;background:var(--c2);left:-150px;top:-200px}
.o2{width:800px;height:800px;background:var(--c1);right:-200px;bottom:-300px;animation-delay:-5s}
.o3{width:500px;height:500px;background:var(--c3);right:300px;top:-250px;opacity:.25;animation-delay:-9s}
@keyframes fl{to{transform:translate(120px,80px) scale(1.2)}}
.s{position:absolute;inset:0;padding:70px 110px 110px;opacity:0;visibility:hidden;transform:scale(1.04);transition:opacity .7s,transform .7s,visibility .7s;display:flex;flex-direction:column;justify-content:center}
.s.on{opacity:1;visibility:visible;transform:none}
.a{opacity:0;transform:translateY(40px)}
.on .a{animation:in .85s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0)*.1s + .2s)}
@keyframes in{to{opacity:1;transform:none}}
h1{font-size:130px;line-height:1.05;margin:0 0 24px;background:linear-gradient(90deg,#fff,var(--c3),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:72px;margin:0 0 12px;background:linear-gradient(90deg,#fff,#a9c4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:36px;color:var(--mut);margin:0 0 30px;max-width:1500px;line-height:1.35}
.tag{font-size:24px;letter-spacing:.3em;text-transform:uppercase;color:var(--c3);margin-bottom:14px}
.g{background:rgba(255,255,255,.06);border:1px solid rgba(140,170,255,.28);border-radius:28px;padding:30px;backdrop-filter:blur(14px);box-shadow:0 0 50px rgba(79,140,255,.16),inset 0 1px 0 rgba(255,255,255,.18)}
.g b{display:block;font-size:40px;margin:8px 0}
.g span{font-size:28px;color:var(--mut);line-height:1.35}
.ic{font-size:66px;filter:drop-shadow(0 0 18px var(--c1))}
.grid{display:grid;gap:26px}
.def{font-size:46px;line-height:1.35;border-left:6px solid var(--c3);padding-left:34px;margin-bottom:34px;max-width:1500px}
.def em{color:var(--c3);font-style:normal}
dl{margin:0;font-size:28px;line-height:1.3}dt{color:var(--c3);font-size:22px;text-transform:uppercase;letter-spacing:.12em;margin-top:16px}dd{margin:4px 0 0}
[data-s],[data-f]{opacity:0;transform:scale(.94);transition:opacity .6s,transform .6s}
.v{opacity:1!important;transform:none!important}
.chain{display:flex;align-items:center;gap:12px}
.chain u{text-decoration:none;color:var(--c3);font-size:44px;animation:nx 1s ease-in-out infinite}
@keyframes nx{50%{transform:translateX(10px);opacity:.4}}
.nd{flex:1;text-align:center;padding:28px 10px;border-radius:26px;border:1px solid rgba(140,170,255,.3);background:rgba(255,255,255,.05);transition:.5s}
.nd i{font-size:72px;font-style:normal;display:block}.nd b{font-size:34px;display:block;margin:8px 0}.nd small{font-size:24px;color:var(--mut)}
.nd.h{background:linear-gradient(135deg,rgba(79,140,255,.55),rgba(139,92,246,.55));box-shadow:0 0 60px var(--c1);transform:translateY(-14px) scale(1.05)}
.cap{position:relative;height:70px;margin-top:36px;font-size:40px;color:var(--c3);text-align:center}
.cap p{position:absolute;inset:0;margin:0}
.mon{position:relative;width:1150px;height:460px;margin:0 auto;border-radius:28px;border:6px solid #3a4a8a;background:#02040c;overflow:hidden;box-shadow:0 0 90px rgba(79,140,255,.4)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pw{font-size:130px;animation:pwp 1.4s ease-in-out infinite}
@keyframes pwp{50%{filter:drop-shadow(0 0 40px var(--c3));transform:scale(1.12)}}
.bios{align-items:flex-start;padding:50px 80px;font-family:Consolas,monospace;font-size:34px;color:#7dffb0;gap:14px}
.ln{opacity:0}.v .ln{animation:in .5s forwards}
.bar{width:520px;height:16px;border-radius:8px;background:#16224f;margin-top:30px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c3),var(--c2));transition:width 2.2s}
.v .bar i{width:100%}
.desk{background:linear-gradient(135deg,#1b3a8f,#6d3fd4 60%,#1fb4d4)}
.w{position:absolute;border-radius:16px;background:rgba(255,255,255,.9);color:#12204d;font-size:26px;padding:50px 24px 0;box-shadow:0 20px 50px rgba(0,0,0,.4);opacity:0}
.w::before{content:"● ● ●";position:absolute;left:16px;top:10px;font-size:20px;color:#ef6a6a}
.v .w{animation:pop .7s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.tb{position:absolute;left:0;right:0;bottom:0;height:60px;background:rgba(5,10,40,.7);display:flex;justify-content:center;gap:24px;align-items:center;font-size:34px}
.cur{position:absolute;font-size:44px;animation:cm 4s ease-in-out infinite}
@keyframes cm{0%{left:900px;top:330px}50%{left:300px;top:130px}100%{left:900px;top:330px}}
.cpu{display:flex;gap:16px;margin:16px 0 6px}
.t{flex:1;padding:30px 0;text-align:center;font-size:40px;font-weight:700;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(140,170,255,.3);animation:hl 4s infinite}
@keyframes hl{0%,24%{background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 60px var(--c1);transform:translateY(-12px)}25%,100%{background:rgba(255,255,255,.06);box-shadow:none;transform:none}}
.ram{position:relative;height:120px;border-radius:24px;overflow:hidden;border:1px solid rgba(140,170,255,.4);background:rgba(255,255,255,.05);margin-top:10px}
.sg{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700}
.core{height:150px;border-radius:22px;background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;animation:cp 1.6s ease-in-out infinite}
@keyframes cp{50%{box-shadow:0 0 70px var(--c3);transform:scale(1.07)}}
.thr{height:22px;border-radius:11px;background:linear-gradient(90deg,var(--c3),var(--c2));margin:14px 0;animation:th 2.4s ease-in-out infinite alternate}
@keyframes th{from{width:25%}to{width:100%}}
.tl{position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:14px;padding-top:50px}
.tl::before{content:"";position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--c3),var(--c2));transform-origin:left;animation:grow 2.2s ease-out both}
@keyframes grow{from{transform:scaleX(0)}}
.tl div{font-size:26px;color:var(--mut);line-height:1.3}.tl b{display:block;font-size:40px;color:#fff}
.tree{font-family:Consolas,monospace;font-size:38px;line-height:1.7}
.mvb{position:absolute;width:70px;height:70px;border-radius:16px;background:linear-gradient(135deg,var(--c3),var(--c2));animation:mv 3s ease-in-out infinite alternate;box-shadow:0 0 30px var(--c3)}
@keyframes mv{from{left:0}to{left:430px}}
.rot{transform-box:fill-box;transform-origin:center;animation:ro 20s linear infinite}
@keyframes ro{to{transform:rotate(360deg)}}
.fl{stroke-dasharray:14 12;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
.pt{animation:rise 3s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-190px);opacity:0}}
.term{font-family:Consolas,monospace;font-size:34px;background:#050a1f;border-radius:20px;padding:30px;min-height:330px;color:#7dffb0;border:1px solid rgba(140,170,255,.3)}
.term div{margin:8px 0}
.flt{animation:flt 3s ease-in-out infinite alternate}
@keyframes flt{to{transform:translateY(-16px)}}
.ring{position:absolute;left:50%;top:50%;border:2px solid var(--c3);border-radius:50%;opacity:0;animation:rg 5s ease-out infinite}
@keyframes rg{from{width:200px;height:200px;margin:-100px;opacity:.7}to{width:1500px;height:1500px;margin:-750px;opacity:0}}
.thx{font-size:100px;margin:10px 0 0;background:linear-gradient(90deg,var(--c3),var(--c2),var(--c1));-webkit-background-clip:text;background-clip:text;color:transparent;animation:gl 3s ease-in-out infinite alternate}
@keyframes gl{to{filter:drop-shadow(0 0 30px var(--c2))}}
#ui{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(3,5,15,.85))}
#ui button{border:1px solid rgba(140,170,255,.4);background:rgba(20,30,70,.7);color:#fff;font-size:18px;padding:10px 22px;border-radius:14px;cursor:pointer}
#ui button:hover{background:rgba(79,140,255,.5)}
#cnt{font-variant-numeric:tabular-nums;font-size:20px;min-width:90px;text-align:center;color:var(--c3)}
#bar{position:fixed;left:0;top:0;height:5px;width:0;background:linear-gradient(90deg,var(--c3),var(--c2));box-shadow:0 0 14px var(--c3);transition:width .6s;z-index:10}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.a,.ln,.w{opacity:1;transform:none}.s{transform:none}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><div class="bg"></div><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>

 <button id="pv" aria-label="Назад">← Назад</button>

var C=function(ic,t,d){return '<div class="g a"><div class="ic">'+ic+'</div><b>'+t+'</b><span>'+d+'</span></div>'};

var S=function(tag,h,sub,body){return '<section class="s"><div class="tag a">'+tag+'</div><h2 class="a">'+h+'</h2>'+(sub?'<p class="sub a">'+sub+'</p>':'')+body+'</section>'};
var SQ=function(n,ms,inner){return '<div class="sq a" data-n="'+n+'" data-ms="'+ms+'">'+inner+'</div>'};

var dl=function(r){return '<div class="g a"><b style="color:'+r[1]+'">'+r[0]+'</b><dl><dt>Интерфейс</dt><dd>'+r[2]+'</dd><dt>Открытость</dt><dd>'+r[3]+'</dd><dt>Применение</dt><dd>'+r[4]+'</dd><dt>Особенность</dt><dd>'+r[5]+'</dd></dl></div>'};

var st=document.getElementById('stage');
st.insertAdjacentHTML('beforeend',slides.join(''));
var sl=[].slice.call(st.querySelectorAll('.s')),n=sl.length,cur=0,timers=[];
sl.forEach(function(s){[].forEach.call(s.querySelectorAll('.a'),function(e,i){e.style.setProperty('--i',i)})});
var bar=document.getElementById('bar'),cnt=document.getElementById('cnt');
function p(x){return (x<10?'0':'')+x}
function fit(){var W=innerWidth,H=innerHeight,s=Math.min(W/1920,H/1080);st.style.transform='translate('+(W-1920*s)/2+'px,'+(H-1080*s)/2+'px) scale('+s+')'}
function run(s){[].forEach.call(s.querySelectorAll('.sq'),function(q){var N=+q.dataset.n,ms=+q.dataset.ms||2200,k=0;
 function ap(){[].forEach.call(q.querySelectorAll('[data-s],[data-f],[data-h]'),function(c){var d=c.dataset;
  if(d.h!==undefined){c.classList.toggle('h',+d.h===k);return}
  var v=false;if(d.s!==undefined)v=d.s.split(' ').indexOf(''+k)>-1;if(d.f!==undefined)v=k>=+d.f;c.classList.toggle('v',v)})}
 ap();timers.push(setInterval(function(){k=(k+1)%N;ap()},ms))})}
function go(i){i=Math.max(0,Math.min(n-1,i));cur=i;timers.forEach(clearInterval);timers=[];
 sl.forEach(function(e,k){e.classList.toggle('on',k===i)});run(sl[i]);
 cnt.textContent=p(i+1)+' / '+p(n);bar.style.width=((i+1)/n*100)+'%';try{history.replaceState(null,'','#'+(i+1))}catch(e){}}

addEventListener('keydown',function(e){
 if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1)}
